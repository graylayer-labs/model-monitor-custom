[project]
name = "model-monitor-cdk"
version = "0.1.0"
description = "CDK constructs for the model-monitor-custom project."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_monitor_cdk"]
