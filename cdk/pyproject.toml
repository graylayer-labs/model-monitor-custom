[project]
name = "model-monitor-cdk"
version = "0.2.0"
description = "CDK infrastructure package for model-monitor-custom — AWS Lambda-based monitoring system"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Eoin McAllister", email = "eoinmc.james@gmail.com"}]
requires-python = ">=3.12"
keywords = ["ml-monitoring", "aws-cdk", "infrastructure", "drift-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/graylayer-labs/model-monitor-custom"
Repository = "https://github.com/graylayer-labs/model-monitor-custom"
Documentation = "https://github.com/graylayer-labs/model-monitor-custom#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_monitor_cdk"]
