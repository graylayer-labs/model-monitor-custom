name: AWS E2E Test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region"
        required: false
        default: "eu-west-1"
        type: string
      no_cleanup:
        description: "Keep AWS resources after test (for debugging)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  aws-e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv sync --group dev
          cd cdk && uv sync

      - name: Run AWS E2E test
        env:
          AWS_REGION: ${{ inputs.region || 'eu-west-1' }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/aws-e2e-test.py \
            --region "$AWS_REGION" \
            ${{ inputs.no_cleanup && '--no-cleanup' || '--cleanup' }} \
            --verbose

      - name: Report results
        if: always()
        run: |
          echo "AWS E2E test execution complete"
          echo "Region: ${{ inputs.region || 'eu-west-1' }}"
          echo "Cleanup: ${{ !inputs.no_cleanup }}"

      - name: Cleanup on failure
        if: failure() && !inputs.no_cleanup
        env:
          AWS_REGION: ${{ inputs.region || 'eu-west-1' }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd cdk
          uv run cdk destroy '*' --force 2>/dev/null || true
          echo "Cleanup completed"
