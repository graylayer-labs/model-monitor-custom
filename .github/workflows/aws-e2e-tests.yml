name: AWS E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mmc-github-e2e-test-role
          aws-region: eu-west-1

      - name: Verify AWS access
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: uv sync

      - name: Run AWS E2E tests
        run: python3 scripts/aws-e2e-test.py --verbose
