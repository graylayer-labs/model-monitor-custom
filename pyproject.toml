# Workspace root — no code lives here directly. Each container + the CDK library
# is its own package under containers/*/pyproject.toml and cdk/pyproject.toml.

[project]
name = "model-monitor-custom-workspace"
version = "0.0.0"
description = "Workspace for the model-monitor-custom project. Not a distributable package."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Eoin McArdle" }]
dependencies = [
    "model-baseline",
    "model-monitor-cdk",
    "mmc-base",
    "mmc-analyser-bias",
    "mmc-analyser-dq",
    "mmc-analyser-explain",
    "mmc-analyser-mq",
    "mmc-analyser-shadow",
    "mmc-example-adult",
]

[tool.uv.workspace]
members = ["containers/baseline", "containers/base", "containers/bias", "containers/dq", "containers/explain", "containers/mq", "containers/shadow", "cdk", "examples/adult-classifier"]

[tool.uv.sources]
model-baseline = { workspace = true }
model-monitor-cdk = { workspace = true }
mmc-base = { workspace = true }
mmc-analyser-bias = { workspace = true }
mmc-analyser-dq = { workspace = true }
mmc-analyser-explain = { workspace = true }
mmc-analyser-mq = { workspace = true }
mmc-analyser-shadow = { workspace = true }
mmc-example-adult = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14.1",
    "ty>=0.0.1a17",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "scikit-learn>=1.5.0",
    "pyarrow>=17.0.0",
    "boto3>=1.34.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["containers", "cdk", "tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "e2e: end-to-end tests that build/run containers (slow, opt-in)",
]

[tool.coverage.run]
branch = true
source = ["containers", "cdk/src"]
omit = [
    "*/tests/*",
    "*/testing/*",
    "*/__init__.py",
    "*/harness.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
