[project]
name = "mmc-analyser-explain"
version = "0.1.0"
description = "Explainability analyser image — real SHAP wrapper with sklearn + XGBoost adapters."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mmc-base",
    "model-baseline",
    "shap>=0.44",
    "scikit-learn>=1.5",
    "xgboost>=2",
    "pandas>=2.0",
    "numpy>=1.26",
    "numba>=0.59",
    "pyarrow>=17.0",
]

[tool.uv.sources]
mmc-base = { workspace = true }
model-baseline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_explain"]
