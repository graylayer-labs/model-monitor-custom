[project]
name = "mmc-analyser-shadow"
version = "0.1.0"
description = "Shadow analyser image — real ShadowAnalyser (serving vs shadow variant comparison, baseline-independent)."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mmc-base",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=17.0.0",
    "scipy>=1.11",
]

[tool.uv.sources]
mmc-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_shadow"]
