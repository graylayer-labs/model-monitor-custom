[project]
name = "mmc-analyser-shadow"
version = "0.1.0"
description = "Shadow analyser image — Phase 3.5 skeleton with NoopShadowAnalyser. Real Shadow math lands in Phase 5."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mmc-base",
]

[tool.uv.sources]
mmc-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_shadow"]
