[project]
name = "mmc-analyser-mq"
version = "0.2.0"
description = "Model Monitor quality metrics (MQ) analyser for drift/bias/quality monitoring"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Eoin McAllister", email = "eoinmc.james@gmail.com"}]
requires-python = ">=3.12"
keywords = ["ml-monitoring", "drift-detection", "analyser-mq", "quality-metrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mmc-base",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/graylayer-labs/model-monitor-custom"
Repository = "https://github.com/graylayer-labs/model-monitor-custom"
Documentation = "https://github.com/graylayer-labs/model-monitor-custom#readme"

[tool.uv.sources]
mmc-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_mq"]
