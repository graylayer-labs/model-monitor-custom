[project]
name = "mmc-analyser-mq"
version = "0.1.0"
description = "MQ analyser image — accuracy / precision / recall / F1 + baseline comparison."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mmc-base",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.4",
]

[tool.uv.sources]
mmc-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_mq"]
