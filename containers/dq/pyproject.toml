[project]
name = "mmc-analyser-dq"
version = "0.1.0"
description = "Data-quality analyser image — Phase 2 skeleton with NoopDqAnalyser. Real math lands in Phase 5."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mmc-base",
]

[tool.uv.sources]
mmc-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_dq"]
