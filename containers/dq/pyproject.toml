[project]
name = "mmc-analyser-dq"
version = "0.1.0"
description = "Data-quality analyser image — schema, completeness, and distribution drift vs a baseline snapshot."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mmc-base",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
]

[tool.uv.sources]
mmc-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_dq"]
