[project]
name = "mmc-base"
version = "0.1.0"
description = "Shared analyser base — env-var contract, IO helpers, entrypoint, failure sidecar, ban-list guard."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "boto3>=1.34",
    "aws-lambda-powertools[tracer]>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmc_base"]
