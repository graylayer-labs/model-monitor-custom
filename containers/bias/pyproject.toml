[project]
name = "mmc-analyser-bias"
version = "0.1.0"
description = "Bias analyser image — smclarify-backed BiasAnalyser (DPL, CDDL, KL, JS, ...)."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mmc-base",
    "smclarify>=0.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=17.0.0",
]

[tool.uv.sources]
mmc-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_bias"]
