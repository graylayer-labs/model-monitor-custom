[project]
name = "mmc-analyser-bias"
version = "0.1.0"
description = "Bias analyser image — Phase 2 skeleton with NoopBiasAnalyser. Real math (smclarify) lands in Phase 3."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "mmc-base",
]

[tool.uv.sources]
mmc-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser_bias"]
